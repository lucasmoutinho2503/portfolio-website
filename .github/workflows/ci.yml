name: CI

on:
  push:
    branches:
      - development
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: HTML Validation
        run: npx htmlhint "**/*.html"

      - name: CSS Validation
        run: npx stylelint "**/*.css"

      - name: JavaScript Validation
        run: npx eslint "**/*.js"